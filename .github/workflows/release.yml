name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller mss pillow winsdk
      - run: npm ci
        working-directory: overlay
      - run: npm run dist
        working-directory: overlay
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: overlay/dist/ARC-Chat-Setup-*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: out

      - uses: actions/checkout@v7
        with:
          path: src

      - name: Zip the plugin template
        run: cd src/plugin-template && zip -r ../../out/arc-chat-plugin-template.zip .

      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: arc-chat
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: cp signed/*.exe out/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.exe
            out/arc-chat-plugin-template.zip
          generate_release_notes: true
