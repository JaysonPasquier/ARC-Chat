name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller mss pillow winsdk
      - run: npm ci
        working-directory: overlay
      - run: npm run dist
        working-directory: overlay
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: overlay/dist/ARC-Chat-Setup-*.exe

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: arc-chat
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: softprops/action-gh-release@v2
        with:
          files: signed/*.exe
          generate_release_notes: true
